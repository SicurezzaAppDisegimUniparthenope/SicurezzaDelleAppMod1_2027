name: Build and publish vulnbox image

# Pubblica su GitHub Container Registry (ghcr.io) l'immagine amd64
# (toolchain multilib, esempi a 32 bit via gcc -m32) usata dagli studenti
# per gli esercizi (docker/vulnbox/), così non devono clonare il repo e
# buildare in locale: basta "docker pull". I runner GitHub-hosted sono
# amd64 nativi, quindi la build non richiede emulazione QEMU.
#
# Si attiva solo alla pubblicazione di una release (tag nel formato di
# questo progetto: YYYYMMDDHHMM), non a ogni push su main.
#
# La prima volta, dopo il primo run riuscito, il pacchetto va reso
# pubblico manualmente una volta sola: Organization/Repo -> Packages ->
# vulnbox -> Package settings -> Change visibility -> Public (altrimenti
# resta privato e "docker pull" degli studenti fallisce senza login).

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nome immagine (owner in minuscolo, richiesto da ghcr.io) e tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vulnbox" >> "$GITHUB_ENV"
          # Il tag dell'immagine segue quello della release (formato di
          # questo progetto: YYYYMMDDHHMM). Su workflow_dispatch manuale
          # (nessuna release) si usa la data corrente come fallback.
          echo "TAG=${RELEASE_TAG:-$(date -u +%Y%m%d%H%M)}" >> "$GITHUB_ENV"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login a ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: docker/vulnbox
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.TAG }}
